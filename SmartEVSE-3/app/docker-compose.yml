# Optional dev-only container: the Vite dev server with hot reload.
# Works the same on Linux, macOS and Windows (Docker Desktop / Docker Engine).
#
#   DEVICE_HOST=192.168.1.50 docker compose up      # then open http://localhost:5173
#
# Production needs no container: the UI is built into the firmware and served by
# the SmartEVSE itself at /app.html (same origin, so CORS never applies). This
# compose is purely a dev convenience — it runs `npm run dev`, and Vite's proxy
# forwards the device endpoints (/settings, /ws/lcd, …) to DEVICE_HOST. The
# browser only ever talks to localhost:5173, so leave the in-app "Device
# address" field empty.
#
# Use the device's IP for DEVICE_HOST: a bridged container can't resolve mDNS
# (`*.local`) names. Linux users who want `.local` can swap the `ports:` mapping
# for `network_mode: host` (see the commented lines below) — but that is
# Linux-only, hence the portable default here.
services:
  dev:
    image: node:24-alpine
    working_dir: /app
    ports:
      - '5173:5173'
    # network_mode: host   # Linux only: resolves <device>.local; drop `ports:` above
    environment:
      # Vite proxies the device endpoints here (see vite.config.ts). Required —
      # without it the browser would have to reach the device cross-origin.
      # `DEVICE_HOST=<ip> docker compose up` wins; otherwise fall back to
      # VITE_DEVICE_HOST from app/.env (which Compose reads too). Without the
      # fallback, an unset DEVICE_HOST injects an EMPTY VITE_DEVICE_HOST that
      # overrides the .env value (Vite prioritises real env vars over .env), so
      # the proxy would silently never forward.
      VITE_DEVICE_HOST: ${DEVICE_HOST:-${VITE_DEVICE_HOST:-}}
    volumes:
      - ./:/app
      # Named volume shadows the host's node_modules (avoids host/container arch
      # mismatch) and persists installs between runs.
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host --port 5173"

volumes:
  node_modules:
